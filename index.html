<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="NuestroEspacio Perú: finanzas en soles, mercado, despensa y tareas compartidas para parejas." />
  <title>NuestroEspacio Perú v2.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','-apple-system','BlinkMacSystemFont','Segoe UI','sans-serif'] },
          boxShadow: { soft: '0 12px 35px rgba(15,23,42,.08)' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100 font-sans">
  <div id="app" class="min-h-screen">
    <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 dark:border-zinc-800 dark:bg-zinc-950/85 glass">
      <div class="mx-auto max-w-7xl px-4 py-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-slate-900 dark:bg-white grid place-items-center text-white dark:text-slate-900 shadow-soft"><i data-lucide="house-heart" class="w-5 h-5"></i></div>
        <div class="min-w-0 flex-1">
          <h1 class="font-semibold tracking-tight">NuestroEspacio</h1>
          <p id="headerSubtitle" class="text-xs text-slate-500 dark:text-zinc-400">Centro compartido del hogar · Perú · v2.1</p>
        </div>
        <button id="themeBtn" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-zinc-800 grid place-items-center hover:bg-slate-50 dark:hover:bg-zinc-900" aria-label="Cambiar tema"><i data-lucide="moon" class="w-4 h-4"></i></button>
        <button id="backupBtn" class="hidden sm:grid w-10 h-10 rounded-xl border border-slate-200 dark:border-zinc-800 place-items-center hover:bg-slate-50 dark:hover:bg-zinc-900" aria-label="Exportar respaldo"><i data-lucide="download" class="w-4 h-4"></i></button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pt-5 safe-bottom">
      <section id="dashboard" class="view active"></section>
      <section id="finanzas" class="view"></section>
      <section id="mercado" class="view"></section>
      <section id="despensa" class="view"></section>
      <section id="recetas" class="view"></section>
      <section id="tareas" class="view"></section>
      <section id="configuracion" class="view"></section>
      <section id="catalogo" class="view"></section>
    </main>

    <button id="fab" class="fixed right-5 bottom-24 z-40 w-14 h-14 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-2xl grid place-items-center active:scale-95 transition"><i data-lucide="plus" class="w-6 h-6"></i></button>

    <nav class="fixed bottom-0 inset-x-0 z-40 border-t border-slate-200/80 bg-white/90 dark:border-zinc-800 dark:bg-zinc-950/90 glass nav-safe">
      <div class="mx-auto max-w-5xl px-2 pt-2 flex gap-1 overflow-x-auto scrollbar-hide">
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-900 dark:text-white bg-slate-100 dark:bg-zinc-900" data-view="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5 mx-auto mb-1"></i>Inicio</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="finanzas"><i data-lucide="wallet-cards" class="w-5 h-5 mx-auto mb-1"></i>Finanzas</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="mercado"><i data-lucide="shopping-cart" class="w-5 h-5 mx-auto mb-1"></i>Mercado</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="despensa"><i data-lucide="package-open" class="w-5 h-5 mx-auto mb-1"></i>Despensa</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="recetas"><i data-lucide="chef-hat" class="w-5 h-5 mx-auto mb-1"></i>Recetas</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="tareas"><i data-lucide="check-square-2" class="w-5 h-5 mx-auto mb-1"></i>Tareas</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="configuracion"><i data-lucide="settings-2" class="w-5 h-5 mx-auto mb-1"></i>Ajustes</button>
        <button class="nav-btn min-w-[72px] flex-1 text-xs py-2 rounded-xl text-slate-500 dark:text-zinc-400" data-view="catalogo"><i data-lucide="database" class="w-5 h-5 mx-auto mb-1"></i>Catálogo</button>
      </div>
    </nav>
  </div>

  <div id="modal" class="modal fixed inset-0 z-50 bg-black/45 items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full sm:max-w-2xl max-h-[92vh] overflow-auto bg-white dark:bg-zinc-900 rounded-t-3xl sm:rounded-3xl shadow-2xl">
      <div class="sticky top-0 z-10 flex items-center justify-between px-5 py-4 bg-white/95 dark:bg-zinc-900/95 glass border-b border-slate-200 dark:border-zinc-800">
        <h2 id="modalTitle" class="font-semibold"></h2>
        <button id="modalClose" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-zinc-800 grid place-items-center"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="modalBody" class="p-5"></div>
    </div>
  </div>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-[60] hidden max-w-[90vw] rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 shadow-2xl text-sm"></div>
  <script src="products.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
